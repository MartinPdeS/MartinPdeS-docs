[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MartinPdeS-docs"
version = "0.2.5"
description = "Shared Sphinx configuration for MartinPdeS scientific Python packages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sphinx>=7",
    "pydata-sphinx-theme>=0.15",
    "sphinx-design>=0.6",
    "sphinx-gallery>=0.16",
    "numpydoc>=1.8,<2",
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["martinpdes_docs*"]

[tool.setuptools.package-data]
martinpdes_docs = ["static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
